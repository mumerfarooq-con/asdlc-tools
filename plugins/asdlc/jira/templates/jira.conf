# Jira leg config for this project. Commit it; /asdlc:jira-setup creates it.
# Format: KEY=value, one per line. Lists are comma-separated. Comments only on
# their own lines (values may contain #). The file is parsed, never executed.
#
# No secrets here. Tokens stay in your shell environment:
#   JIRA_EMAIL, JIRA_TOKEN          Jira (Atlassian) login email + API token
#   BITBUCKET_TOKEN                 Bitbucket access token
#   BITBUCKET_EMAIL                 only with BB_AUTH=basic

# --- Jira ---
# Site URL, no trailing slash, e.g. https://your-team.atlassian.net
JIRA_BASE_URL=
# Project KEY (used in API calls and JQL), and its display name (display only)
JIRA_PROJECT_KEY=
JIRA_PROJECT_NAME=
# Only needed when the project has more than one board (see jira-sprints.sh)
JIRA_BOARD_ID=

# --- Bitbucket ---
BB_WORKSPACE=
BB_REPO=
# bearer (workspace/repo access tokens, user API tokens) or basic (personal API
# token that Bearer rejects; also set BITBUCKET_EMAIL)
BB_AUTH=bearer
# Branch PRs target and reviews diff against
TARGET_BRANCH=

# --- Workflow statuses (exact names from your board) ---
# Statuses planning picks up
STATUS_DEFAULT=To Do
# Where a ticket goes back to once it has the information it was missing
STATUS_TODO=To Do
STATUS_IN_PROGRESS=In Progress
STATUS_NEEDS_INFO=Needs info
# Set on merge (by Jira automation), never by the pipeline
STATUS_TESTING=Testing
# Atlassian accountIds to watch + @mention on merge (list them with jira-people.sh)
NOTIFY_ACCOUNT_IDS=

# --- Tickets ---
# Issue types that use the bug template; every other type uses the feature template
TEMPLATE_BUG_TYPES=Bug
# strict: incomplete tickets go to STATUS_NEEDS_INFO. warn: planned, gaps become open questions
TICKET_CHECK_MODE=warn
# Prefix on every Jira comment the pipeline posts; such comments are ignored when reading tickets
PIPELINE_COMMENT_MARKER=[asdlc]
# Link types that stop planning ("is blocked by" an unfinished ticket)
LINK_BLOCKER_TYPES=Blocks
# Link types that may mean the work is already done
LINK_DUPLICATE_TYPES=Duplicate,Cloners
# Attachment download caps
MAX_IMAGES=10
MAX_IMAGE_MB=5

# --- Planning ---
# Words that force council review and an access check when a change touches them
SENSITIVE_TOPICS=access,permission,payment
# Per-project knowledge the planner reads on every run
ACCESS_RULES_PATH=docs/access-rules.md
KNOWN_TRAPS_PATH=docs/known-traps.md
# Other local repos the impact scan searches, read-only (e.g. ../web-frontend)
IMPACT_EXTRA_PATHS=
# Folders the impact scan skips
IMPACT_EXCLUDE=.git,node_modules,.venv

# --- Review depth (review-mode.sh) ---
# Council review when files changed >= FILES, or lines changed >= LINES,
# or any changed path matches the PATHS regex
REVIEW_COUNCIL_FILES=10
REVIEW_COUNCIL_LINES=400
REVIEW_COUNCIL_PATHS=(migration|migrations|auth|security|secret|credential|password|payment|billing|Dockerfile|\.github/|terraform|helm|k8s|deploy|infra)
